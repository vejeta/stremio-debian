name: Build stremio-cef Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'stremio-cef version to build (e.g., 1.0.0~beta.13+ds-8)'
        required: true
        type: string
      force_rebuild:
        description: 'Force rebuild even if packages exist'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  DEBEMAIL: "vejeta@gmail.com"
  DEBFULLNAME: "Juan Manuel Mendez Rey"

jobs:
  preflight:
    name: Preflight version-consistency check
    runs-on: ubuntu-latest
    steps:
      - name: Verify CEF/rust-cef versions are consistent before building
        run: |
          set -euo pipefail
          SALSA=https://salsa.debian.org/mendezr
          REPO=https://debian.vejeta.com

          # What stremio-cef (Salsa master) requires
          CTRL=$(curl -fsSL "$SALSA/stremio-cef/-/raw/master/debian/control")
          LIBCEF_MAJOR=$(printf '%s\n' "$CTRL" | grep -oE 'libcef[0-9]+' | head -1 | grep -oE '[0-9]+')
          RUST_REQ_MAJOR=$(printf '%s\n' "$CTRL" | grep -oE 'librust-cef-dev \(>= [0-9]+' | grep -oE '[0-9]+' | head -1)

          # What rust-cef / rust-cef-dll-sys (Salsa main) will build
          RUST_CEF_MAJOR=$(curl -fsSL "$SALSA/rust-cef/-/raw/main/changelog" | head -1 | grep -oE '\([0-9]+' | grep -oE '[0-9]+')
          RUST_DLL_MAJOR=$(curl -fsSL "$SALSA/rust-cef-dll-sys/-/raw/main/changelog" | head -1 | grep -oE '\([0-9]+' | grep -oE '[0-9]+')

          # What the APT repo can provide as a build-dep
          REPO_LIBCEFDEV_MAJOR=$(curl -fsSL "$REPO/dists/sid/main/binary-amd64/Packages" \
            | awk '/^Package: libcef-dev$/{f=1} f&&/^Version:/{print $2; f=0}' | sort -V | tail -1 | grep -oE '^[0-9]+' || true)

          echo "stremio-cef needs: libcef$LIBCEF_MAJOR, librust-cef-dev (>= $RUST_REQ_MAJOR)"
          echo "rust-cef builds: $RUST_CEF_MAJOR | rust-cef-dll-sys builds: $RUST_DLL_MAJOR"
          echo "APT repo libcef-dev: $REPO_LIBCEFDEV_MAJOR"

          fail=0
          if [ -n "$RUST_REQ_MAJOR" ]; then
            [ "${RUST_CEF_MAJOR:-0}" -ge "$RUST_REQ_MAJOR" ] || { echo "::error::rust-cef builds $RUST_CEF_MAJOR but stremio-cef needs librust-cef-dev (>= $RUST_REQ_MAJOR). Update the rust-cef submodule to >= $RUST_REQ_MAJOR on Salsa."; fail=1; }
            [ "${RUST_DLL_MAJOR:-0}" -ge "$RUST_REQ_MAJOR" ] || { echo "::error::rust-cef-dll-sys builds $RUST_DLL_MAJOR but stremio-cef needs >= $RUST_REQ_MAJOR. Update the rust-cef-dll-sys submodule."; fail=1; }
          fi
          if [ -n "$LIBCEF_MAJOR" ]; then
            [ "${REPO_LIBCEFDEV_MAJOR:-0}" -ge "$LIBCEF_MAJOR" ] || { echo "::error::APT repo has libcef-dev $REPO_LIBCEFDEV_MAJOR but stremio-cef needs libcef$LIBCEF_MAJOR. Promote+deploy the CEF $LIBCEF_MAJOR release before building stremio-cef."; fail=1; }
          fi
          exit $fail

  build-rust-cef-dll-sys:
    name: Build rust-cef-dll-sys - sid amd64
    needs: [preflight]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Sync rust-cef-dll-sys to latest Salsa
        run: |
          # Salsa is the source of truth; build the latest commit, not the pin
          # (these repos use the 'main' default branch). Keeps rust-cef-dll-sys
          # in lockstep with stremio-cef, which also syncs to Salsa at build time.
          git config --global --add safe.directory '*'
          git -C rust-cef-dll-sys fetch origin --quiet
          git -C rust-cef-dll-sys checkout --quiet origin/main
          echo "rust-cef-dll-sys -> $(git -C rust-cef-dll-sys log -1 --oneline)"

      - name: Build in sid container
        run: |
          docker run --rm --platform linux/amd64 --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:sid \
            bash -c '
              set -e

              apt-get update && apt-get upgrade -y

              # Add stremio-debian repository for CEF packages
              apt-get install -y wget gnupg
              wget -qO - https://debian.vejeta.com/key.gpg | gpg --dearmor -o /usr/share/keyrings/stremio-debian.gpg
              echo "deb [signed-by=/usr/share/keyrings/stremio-debian.gpg] https://debian.vejeta.com sid main non-free" > /etc/apt/sources.list.d/stremio.list
              apt-get update

              # Install debcargo and base build tools
              apt-get install -y debcargo devscripts equivs dpkg-dev fakeroot lintian

              # Extract version from overlay changelog
              VERSION=$(head -1 rust-cef-dll-sys/changelog | sed "s/.*(\(.*\)).*/\1/")
              UPSTREAM_VERSION=$(echo "$VERSION" | cut -d- -f1)
              echo "Building rust-cef-dll-sys version: $VERSION (upstream: $UPSTREAM_VERSION)"

              # Generate source package with debcargo
              # All directories must be on the same filesystem (/workspace mount)
              # to avoid EXDEV (cross-device link) errors from rename() in Docker
              mkdir -p /workspace/_debcargo_build
              rm -rf /workspace/_debcargo_build/rust-cef-dll-sys /workspace/_debcargo_build/rust-cef-dll-sys_*.orig.tar.*
              export TMPDIR=/workspace/_debcargo_build
              export CARGO_HOME=/workspace/_debcargo_build/.cargo
              debcargo package \
                --config /workspace/rust-cef-dll-sys/debcargo.toml \
                --directory /workspace/_debcargo_build/rust-cef-dll-sys \
                --no-overlay-write-back \
                --changelog-ready \
                cef-dll-sys "$UPSTREAM_VERSION"

              # Install build dependencies
              cd /workspace/_debcargo_build/rust-cef-dll-sys
              apt-get build-dep -y .

              # Build binary packages
              dpkg-buildpackage -b -us -uc

              # Lintian check
              echo "=== Running lintian checks ==="
              lintian --info --display-info --pedantic ../*.deb || true

              # Collect debs (exclude equivs build-deps packages)
              mkdir -p /workspace/build-output-cef-dll-sys
              cp /workspace/_debcargo_build/librust-cef-dll-sys*.deb /workspace/build-output-cef-dll-sys/

              echo "=== Built packages ==="
              ls -lh /workspace/build-output-cef-dll-sys/
            '

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts/rust-cef-dll-sys-sid-amd64

          for deb in build-output-cef-dll-sys/*.deb; do
            if [ -f "$deb" ]; then
              filename=$(basename "$deb")
              newname="${filename%.deb}-sid.deb"
              cp "$deb" "artifacts/rust-cef-dll-sys-sid-amd64/$newname"
            fi
          done

          echo "=== Collected artifacts ==="
          ls -lah artifacts/rust-cef-dll-sys-sid-amd64/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust-cef-dll-sys-packages-sid-amd64
          path: artifacts/rust-cef-dll-sys-sid-amd64/*.deb
          retention-days: 90

  build-rust-cef:
    name: Build rust-cef - sid amd64
    needs: [build-rust-cef-dll-sys]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Sync rust-cef to latest Salsa
        run: |
          # Build the latest Salsa commit, not the pin (default branch 'main')
          git config --global --add safe.directory '*'
          git -C rust-cef fetch origin --quiet
          git -C rust-cef checkout --quiet origin/main
          echo "rust-cef -> $(git -C rust-cef log -1 --oneline)"

      - name: Download rust-cef-dll-sys packages
        uses: actions/download-artifact@v8
        with:
          name: rust-cef-dll-sys-packages-sid-amd64
          path: rust-cef-dll-sys-debs

      - name: Build in sid container
        run: |
          docker run --rm --platform linux/amd64 --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:sid \
            bash -c '
              set -e

              apt-get update && apt-get upgrade -y

              # Add stremio-debian repository for CEF packages
              apt-get install -y wget gnupg
              wget -qO - https://debian.vejeta.com/key.gpg | gpg --dearmor -o /usr/share/keyrings/stremio-debian.gpg
              echo "deb [signed-by=/usr/share/keyrings/stremio-debian.gpg] https://debian.vejeta.com sid main non-free" > /etc/apt/sources.list.d/stremio.list
              apt-get update

              # Install rust-cef-dll-sys packages from previous build
              echo "=== Installing rust-cef-dll-sys packages ==="
              dpkg -i rust-cef-dll-sys-debs/*.deb || apt-get install -f -y

              # Install debcargo and base build tools
              apt-get install -y debcargo devscripts equivs dpkg-dev fakeroot lintian

              # Extract version from overlay changelog
              VERSION=$(head -1 rust-cef/changelog | sed "s/.*(\(.*\)).*/\1/")
              UPSTREAM_VERSION=$(echo "$VERSION" | cut -d- -f1)
              echo "Building rust-cef version: $VERSION (upstream: $UPSTREAM_VERSION)"

              # Generate source package with debcargo
              # All directories must be on the same filesystem (/workspace mount)
              # to avoid EXDEV (cross-device link) errors from rename() in Docker
              mkdir -p /workspace/_debcargo_build
              rm -rf /workspace/_debcargo_build/rust-cef /workspace/_debcargo_build/rust-cef_*.orig.tar.*
              export TMPDIR=/workspace/_debcargo_build
              export CARGO_HOME=/workspace/_debcargo_build/.cargo
              debcargo package \
                --config /workspace/rust-cef/debcargo.toml \
                --directory /workspace/_debcargo_build/rust-cef \
                --no-overlay-write-back \
                --changelog-ready \
                cef "$UPSTREAM_VERSION"

              # Install build dependencies
              cd /workspace/_debcargo_build/rust-cef
              apt-get build-dep -y .

              # Build binary packages
              dpkg-buildpackage -b -us -uc

              # Lintian check
              echo "=== Running lintian checks ==="
              lintian --info --display-info --pedantic ../*.deb || true

              # Collect debs (exclude equivs build-deps packages and dll-sys packages)
              mkdir -p /workspace/build-output-cef
              for deb in /workspace/_debcargo_build/librust-cef-dev*.deb /workspace/_debcargo_build/librust-cef+*.deb; do
                [ -f "$deb" ] && cp "$deb" /workspace/build-output-cef/
              done

              echo "=== Built packages ==="
              ls -lh /workspace/build-output-cef/
            '

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts/rust-cef-sid-amd64

          for deb in build-output-cef/*.deb; do
            if [ -f "$deb" ]; then
              filename=$(basename "$deb")
              newname="${filename%.deb}-sid.deb"
              cp "$deb" "artifacts/rust-cef-sid-amd64/$newname"
            fi
          done

          echo "=== Collected artifacts ==="
          ls -lah artifacts/rust-cef-sid-amd64/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust-cef-packages-sid-amd64
          path: artifacts/rust-cef-sid-amd64/*.deb
          retention-days: 90

  build-stremio-cef:
    name: Build stremio-cef - sid amd64
    needs: [build-rust-cef]
    runs-on: ubuntu-latest
    # Only build for sid/amd64 - matches CEF availability
    # CEF packages must be available in the APT repository first
    #
    # Uses sbuild (--chroot-mode=unshare, no persistent chroot needed on this
    # ephemeral GitHub-hosted runner) instead of a hand-maintained apt-get
    # install list + `dpkg -i ... || apt-get install -f -y`. That older
    # approach hit a reproducible failure on 2026-09-24/25 where pristine-tar
    # (and its perl dependency) installed via dpkg without error but could
    # not be exec'd afterwards; it did not reproduce in a plain `debian:sid`
    # container with the same package list, so it looks specific to that
    # dpkg -i / apt-get -f dance rather than the packages themselves. sbuild
    # resolves debian/control's Build-Depends via plain `apt-get build-dep`,
    # which never puts dpkg through that unconfigured-then-fixed sequence.
    # Freshly-built rust-cef-dll-sys/rust-cef debs are handed to sbuild with
    # --extra-package=<dir>, which copies them into the chroot as a local
    # repository, so apt resolves them like any other archive package
    # instead of a manual dpkg -i.

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download rust-cef-dll-sys and rust-cef packages into a local repo
        uses: actions/download-artifact@v8
        with:
          pattern: 'rust-cef*-packages-sid-amd64'
          path: local-repo
          merge-multiple: true

      - name: Verify stremio-cef submodule
        run: |
          if [ ! -d "stremio-cef/debian" ]; then
            echo "ERROR: stremio-cef submodule not properly checked out"
            exit 1
          fi
          echo "stremio-cef submodule verified"
          ls -la stremio-cef/

      - name: Install sbuild and build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            sbuild mmdebstrap uidmap dpkg-dev debhelper debian-archive-keyring \
            git-buildpackage pristine-tar quilt devscripts lintian
          sbuild --version

      - name: Create sbuild unstable chroot tarball
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor; unshare-mode mmdebstrap and sbuild both need them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Ubuntu's sbuild (0.85) does not bootstrap an unshare chroot on its
          # own: it expects ~/.cache/sbuild/<dist>-<arch>.tar to exist. The
          # self-hosted CEF runner has one from its initial setup; this
          # ephemeral runner has to create it every time.
          mkdir -p ~/.cache/sbuild
          mmdebstrap --variant=buildd --include=ca-certificates \
            --keyring=/usr/share/keyrings/debian-archive-keyring.gpg \
            unstable ~/.cache/sbuild/unstable-amd64.tar \
            http://deb.debian.org/debian
          ls -lh ~/.cache/sbuild/

      - name: List freshly-built rust-cef debs
        run: ls -lh local-repo/

      - name: Sync stremio-cef to latest Salsa and generate source package
        run: |
          git config --global user.email "$DEBEMAIL"
          git config --global user.name "$DEBFULLNAME"
          git config --global --add safe.directory "*"

          cd stremio-cef

          # Sync to latest Salsa (source of truth)
          echo "=== Syncing stremio-cef to latest Salsa ==="
          git fetch origin
          git checkout origin/master
          echo "Synced to: $(git log -1 --oneline)"

          # Fetch pristine-tar and upstream branches so gbp can materialize
          # the orig tarball itself (no manual `pristine-tar checkout` step
          # needed -- gbp handles it as part of generating the source
          # package, and the resulting .dsc + orig tarball carry vendor/
          # into the sbuild chroot automatically when unpacked there).
          echo "=== Fetching pristine-tar and upstream branches ==="
          git fetch origin pristine-tar:pristine-tar upstream:upstream

          VERSION=$(dpkg-parsechangelog -S Version)
          echo "Building stremio-cef version: $VERSION"

          # Source-only build: produces the .dsc + orig/debian tarballs, no
          # compilation happens here, so this doesn't need libcef-dev/vendor/
          # or any of stremio-cef's own Build-Depends installed.
          # --git-ignore-branch needed because the submodule is in detached
          # HEAD state. Note: debian/rules on Salsa must NOT have
          # dh_quilt_unpatch in override_dh_clean.
          gbp buildpackage --git-ignore-branch --git-pristine-tar \
            --git-upstream-branch=upstream -S -us -uc -d

          echo "=== Generated source package ==="
          ls -lh ../*.dsc ../*.orig.tar.* ../*.debian.tar.*

      - name: Build stremio-cef packages with sbuild
        run: |
          FULLVER=$(dpkg-parsechangelog -l stremio-cef/debian/changelog -S Version)
          mkdir -p tmp
          LOGFILE="tmp/sbuild-stremio-cef-amd64-$(date +%Y%m%d-%H%M).log"

          echo "==> Building stremio-cef packages with sbuild"
          sbuild --arch=amd64 --dist=unstable \
            --chroot-mode=unshare \
            --build-dep-resolver=apt --verbose \
            --extra-repository="deb [trusted=yes] https://debian.vejeta.com sid main non-free" \
            --extra-package="$PWD/local-repo" \
            "stremio-cef_${FULLVER}.dsc" \
            2>&1 | tee "$LOGFILE"

          if grep -q "^Status: successful" "$LOGFILE"; then
            echo "==> Build successful"
          else
            echo "==> Build FAILED"
            grep "^Fail-Stage:\|^Status:\|^E:" "$LOGFILE" || true
            exit 1
          fi

      - name: Run lintian checks
        continue-on-error: true
        run: lintian --info --display-info --pedantic ./*.deb || true

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts/stremio-cef-sid-amd64

          # sbuild produces .deb files in the current directory. This one
          # source package builds two binaries -- stremio-cef and the
          # empty stremio-gtk transitional -- so glob everything, not just
          # stremio-cef_*.deb.
          for deb in ./*.deb; do
            if [ -f "$deb" ]; then
              filename=$(basename "$deb")
              newname="${filename%.deb}-sid.deb"
              mv "$deb" "artifacts/stremio-cef-sid-amd64/$newname"
            fi
          done

          mv ./*.buildinfo artifacts/stremio-cef-sid-amd64/ 2>/dev/null || true
          mv ./*.changes artifacts/stremio-cef-sid-amd64/ 2>/dev/null || true

          echo "=== Collected artifacts ==="
          ls -lah artifacts/stremio-cef-sid-amd64/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stremio-cef-packages-sid-amd64
          path: artifacts/stremio-cef-sid-amd64/*.deb
          retention-days: 90

      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stremio-cef-all-sid-amd64
          path: artifacts/stremio-cef-sid-amd64/*
          retention-days: 90

  build-stremio-server:
    name: Build stremio-server - sid
    needs: [preflight]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build stremio-server in sid container
        run: |
          docker run --rm --platform linux/amd64 --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            -e DEBEMAIL="vejeta@gmail.com" \
            -e DEBFULLNAME="Juan Manuel Mendez Rey" \
            debian:sid \
            bash -c '
              set -e

              apt-get update && apt-get upgrade -y
              apt-get install -y \
                git debhelper-compat nodejs npm \
                devscripts lintian dpkg-dev fakeroot

              git config --global user.email "$DEBEMAIL"
              git config --global user.name "$DEBFULLNAME"
              git config --global --add safe.directory "*"

              cd stremio-server

              # Sync to latest Salsa
              echo "=== Syncing stremio-server to latest Salsa ==="
              git fetch origin
              git checkout origin/master
              echo "Synced to: $(git log -1 --oneline)"

              # Get version from changelog
              VERSION=$(dpkg-parsechangelog -S Version)
              echo "Building stremio-server version: $VERSION"

              # Build binary package (simple build without pristine-tar)
              dpkg-buildpackage -b -us -uc

              # Lintian check
              echo "=== Running lintian checks ==="
              lintian --info --display-info --pedantic ../*.deb || true
            '

      - name: Collect stremio-server artifacts
        run: |
          mkdir -p artifacts/stremio-server-sid

          for deb in stremio-server/../stremio-server*.deb; do
            if [ -f "$deb" ]; then
              filename=$(basename "$deb")
              newname="${filename%.deb}-sid.deb"
              mv "$deb" "artifacts/stremio-server-sid/$newname"
            fi
          done

          echo "=== Collected stremio-server artifacts ==="
          ls -lah artifacts/stremio-server-sid/

      - name: Upload stremio-server artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stremio-server-packages-sid
          path: artifacts/stremio-server-sid/*.deb
          retention-days: 90

  create-stremio-cef-release:
    name: Create stremio-cef Release
    needs: [build-rust-cef-dll-sys, build-rust-cef, build-stremio-cef, build-stremio-server]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Display artifacts
        run: ls -R release-artifacts

      - name: Create release notes
        run: |
          STREMIO_CEF_VERSION="${{ github.event.inputs.version }}"
          # Sanitize version for GitHub tag (~ and + are not allowed)
          # 1.0.0~beta.13+ds-8 -> 1.0.0-beta.13.ds-8
          STREMIO_CEF_TAG_VERSION=$(echo "$STREMIO_CEF_VERSION" | sed 's/~/-/g; s/+/./g')
          echo "STREMIO_CEF_TAG_VERSION=$STREMIO_CEF_TAG_VERSION" >> $GITHUB_ENV
          echo "Original version: $STREMIO_CEF_VERSION"
          echo "Tag version: $STREMIO_CEF_TAG_VERSION"
          BUILD_DATE="$(date -u +"%Y-%m-%d %H:%M UTC")"
          WORKFLOW_ID="${GITHUB_RUN_ID}"

          cat > RELEASE_NOTES.md << 'EOF'
          # stremio-cef VERSION_PLACEHOLDER

          ## Packages

          - **stremio-cef** - CEF-based Stremio client (GTK4/Adwaita UI), formerly named stremio-gtk
          - **stremio-gtk** - empty transitional package pulling in stremio-cef, for upgraders
          - **stremio-server** - Stremio streaming server (deprecated; kept for trixie/bookworm
            until `stremio-server-installer` reaches those suites, see the landing page)
          - **librust-cef-dll-sys-dev** - Rust FFI bindings to CEF (build dependency)
          - **librust-cef-dev** - Rust bindings to CEF (build dependency)

          ## Installation

          These packages are available in the APT repository for Debian sid:

          ```bash
          wget -qO - https://debian.vejeta.com/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/stremio-debian.gpg
          echo "deb [signed-by=/usr/share/keyrings/stremio-debian.gpg] https://debian.vejeta.com sid main non-free" | sudo tee /etc/apt/sources.list.d/stremio.list
          sudo apt update
          sudo apt install stremio-cef
          ```

          ## Dependencies

          stremio-cef requires CEF packages (installed automatically via APT dependencies):
          - libcef (runtime library)
          - libcef-common (shared resources)

          It also `Recommends: stremio-server-installer` for the streaming server component.

          ## Why stremio-cef?

          Debian now ships its own `stremio` package (the GTK4/libadwaita/WebKitGTK6 rewrite,
          ITP #943703, accepted 2026-09-24), which is also GTK4-based - so the old "-gtk" suffix
          no longer distinguished anything. This build (formerly stremio-gtk) is kept for
          hardware and setups where the CEF renderer still works better than WebKitGTK6.

          ## Build Information

          - Built on: DATE_PLACEHOLDER
          - Distribution: Debian sid (unstable)
          - Architecture: amd64 only
          - Build runner: GitHub-hosted
          - Workflow: WORKFLOW_PLACEHOLDER

          ## Note

          stremio-cef is only available for Debian sid due to CEF dependencies (clang-19 requirement).

          ## Source Code

          - [stremio-cef on Salsa](https://salsa.debian.org/mendezr/stremio-cef)
          - [rust-cef on Salsa](https://salsa.debian.org/mendezr/rust-cef)
          - [rust-cef-dll-sys on Salsa](https://salsa.debian.org/mendezr/rust-cef-dll-sys)

          ## License

          stremio-cef is licensed under GPL-3.0-only and is distributed in the `main` component.
          Rust CEF bindings are licensed under MIT/Apache-2.0 and are distributed in the `main` component.
          EOF

          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/$STREMIO_CEF_VERSION/g" RELEASE_NOTES.md
          sed -i "s/DATE_PLACEHOLDER/$BUILD_DATE/g" RELEASE_NOTES.md
          sed -i "s/WORKFLOW_PLACEHOLDER/$WORKFLOW_ID/g" RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Delete existing release assets if rebuilding
        run: |
          TAG="stremio-cef-${{ env.STREMIO_CEF_TAG_VERSION }}"
          REPO="${{ github.repository }}"
          # Delete all assets by ID via API (avoids filename encoding issues)
          RELEASE_ID=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id' 2>/dev/null) || true
          if [ -n "$RELEASE_ID" ]; then
            gh api "repos/$REPO/releases/$RELEASE_ID/assets" --jq '.[].id' | while read -r asset_id; do
              echo "Deleting asset ID: $asset_id"
              gh api -X DELETE "repos/$REPO/releases/assets/$asset_id"
            done
            echo "All existing assets deleted"
          else
            echo "No existing release found for $TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: stremio-cef-${{ env.STREMIO_CEF_TAG_VERSION }}
          name: stremio-cef ${{ github.event.inputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release-artifacts/rust-cef-dll-sys-packages-*/*.deb
            release-artifacts/rust-cef-packages-*/*.deb
            release-artifacts/stremio-cef-packages-*/*.deb
            release-artifacts/stremio-server-packages-*/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger repository update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: stremio-cef-packages-updated
          client-payload: '{"version": "${{ github.event.inputs.version }}"}'
